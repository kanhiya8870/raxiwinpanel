<title>RAXI WIN PANEL</title>

<style>
:root{
    --panel-width:220px;
    --red:#ff1738;
    --red2:#ff4d4d;
    --red3:#ff9999;
    --green:#00ff66;
    --deep:#100000;
    --deep2:#220000;
    --deep3:#420000;
    --white:#ffffff;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#1a0000;
    font-family:'Rajdhani',sans-serif;
    position:relative;
}

/* =========================================================
   BACKGROUND
========================================================= */

#bg-iframe{
    width:100%;
    height:100%;
    border:none;
    position:absolute;
    inset:0;
    z-index:1;
}

/* =========================================================
   GLOBAL SHAKE
========================================================= */

@keyframes fullScreenShake{
    0%{transform:translate(0,0)}
    20%{transform:translate(2px,1px)}
    40%{transform:translate(-2px,-1px)}
    60%{transform:translate(1px,-1px)}
    80%{transform:translate(-1px,1px)}
    100%{transform:translate(0,0)}
}

.shake-active{
    animation:fullScreenShake .32s ease-in-out both;
}

/* =========================================================
   FLOATING LOGO
========================================================= */

#floating-logo{
    position:fixed;
    top:25px;
    right:15px;
    width:54px;
    height:54px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    z-index:9999;
    touch-action:none;
    background:rgba(20,0,0,.9);
    box-shadow:
        0 0 15px rgba(255,50,50,.6),
        0 0 25px rgba(255,0,0,.3);
    animation:
        floatLogo 3.5s ease-in-out infinite alternate,
        logoBreathing 2.5s ease-in-out infinite;
}

#floating-logo::before{
    content:'';
    position:absolute;
    inset:-2px;
    border-radius:50%;
    background:
        conic-gradient(
            from 0deg,
            #ff0055,
            #ff4d4d,
            transparent 60%,
            #ff0055
        );
    animation:logoRotate 2.5s linear infinite;
    z-index:0;
    pointer-events:none;
}

#floating-logo::after{
    content:'';
    position:absolute;
    inset:-5px;
    border-radius:50%;
    border:1px solid rgba(255,80,80,.5);
    animation:
        logoPulse 1.8s ease-in-out infinite alternate,
        reverseRing 4s linear infinite;
    z-index:0;
    pointer-events:none;
}

.logo-img-wrapper{
    width:86%;
    height:86%;
    border-radius:50%;
    overflow:hidden;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    z-index:2;
    border:1px solid rgba(255,100,100,.6);
    box-shadow:inset 0 0 10px rgba(255,0,0,.35);
}

.logo-img-wrapper img{
    width:100%;
    height:100%;
    object-fit:cover;
    animation:logoImagePulse 2s ease-in-out infinite;
}

/* =========================================================
   PANEL WRAPPER
========================================================= */

.panel-floating-wrapper{
    position:fixed;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:10000;
    touch-action:none;
}

/* =========================================================
   VIP PANEL
========================================================= */

#vip-panel{
    width:var(--panel-width);
    background:
        linear-gradient(
            135deg,
            #420000 0%,
            #220000 50%,
            #100000 100%
        );
    border-radius:18px;
    padding:4px;
    position:relative;
    box-shadow:
        0 10px 30px rgba(0,0,0,.95),
        0 0 20px rgba(255,30,30,.3);
    overflow:hidden;
    animation:
        panelFloat 4s ease-in-out infinite,
        panelGlow 3s ease-in-out infinite;
}

#vip-panel::before{
    content:'';
    position:absolute;
    top:-50%;
    left:-50%;
    width:200%;
    height:200%;
    background:
        conic-gradient(
            transparent 0deg,
            transparent 70deg,
            #ff4d4d 90deg,
            #ffffff 100deg,
            transparent 115deg,
            transparent 230deg,
            #ff1738 270deg,
            transparent 300deg
        );
    animation:
        thinBorderRotate 3s linear infinite,
        borderSweep 5s linear infinite;
    z-index:0;
    pointer-events:none;
}

#vip-panel::after{
    content:'';
    position:absolute;
    width:30px;
    height:180%;
    left:-60px;
    top:-40%;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.6),
            transparent
        );
    transform:rotate(22deg);
    filter:blur(3px);
    animation:edgeSweep 3.8s linear infinite;
    z-index:4;
    pointer-events:none;
}

/* =========================================================
   INNER PANEL
========================================================= */

.inner-panel-content{
    position:relative;
    z-index:2;
    background:
        linear-gradient(
            135deg,
            #3b0000 0%,
            #1c0000 100%
        );
    border-radius:15px;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
    overflow:hidden;
}

.inner-panel-content::before{
    content:'';
    position:absolute;
    inset:0;
    background:
        linear-gradient(135deg, rgba(255,50,50,.08) 25%, transparent 25%),
        linear-gradient(225deg, rgba(255,50,50,.08) 25%, transparent 25%),
        linear-gradient(45deg, rgba(255,50,50,.08) 25%, transparent 25%),
        linear-gradient(315deg, rgba(255,50,50,.08) 25%, transparent 25%);
    background-size:16px 16px;
    animation:gridMove 4s linear infinite;
    pointer-events:none;
    z-index:1;
    opacity:.7;
}

.inner-panel-content::after{
    content:'';
    position:absolute;
    left:0;
    top:-100%;
    width:100%;
    height:60%;
    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255,60,80,.06),
            rgba(255,255,255,.08),
            rgba(255,60,80,.06),
            transparent
        );
    animation:panelScan 3.5s linear infinite;
    pointer-events:none;
    z-index:1;
}

/* =========================================================
   CORNER PINS
========================================================= */

.corner-pin{
    position:absolute;
    width:8px;
    height:8px;
    z-index:20;
    pointer-events:none;
}

.corner-pin-tl{ top:3px; left:3px; border-top:2px solid #ff9999; border-left:2px solid #ff9999; }
.corner-pin-tr{ top:3px; right:3px; border-top:2px solid #ff9999; border-right:2px solid #ff9999; }
.corner-pin-bl{ bottom:3px; left:3px; border-bottom:2px solid #ff9999; border-left:2px solid #ff9999; }
.corner-pin-br{ bottom:3px; right:3px; border-bottom:2px solid #ff9999; border-right:2px solid #ff9999; }

/* =========================================================
   HEADER
========================================================= */

.header-top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(30,0,0,.85);
    padding:6px 10px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.2);
    cursor:move;
    z-index:5;
    position:relative;
    overflow:hidden;
    transform-style:preserve-3d;
    animation:headerBreath 2.4s ease-in-out infinite;
}

.header-top-row::after{
    content:'';
    position:absolute;
    top:0;
    left:-70px;
    width:40px;
    height:100%;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.3),
            transparent
        );
    transform:skewX(-20deg);
    animation:headerShine 2.6s linear infinite;
    pointer-events:none;
}

.header-title{
    font-family:'Orbitron',sans-serif;
    color:#ffffff;
    font-size:12px;
    font-weight:900;
    letter-spacing:1px;
    text-shadow:0 0 8px rgba(255,77,77,.8);
    animation:titlePulse 2s ease-in-out infinite;
}

.active-badge{
    background:rgba(0,255,100,.2);
    color:#00ff66;
    font-family:'Share Tech Mono',monospace;
    font-size:9px;
    padding:2px 6px;
    border-radius:5px;
    font-weight:bold;
    border:1px solid rgba(0,255,100,.5);
    display:flex;
    align-items:center;
    gap:4px;
    position:relative;
    overflow:hidden;
    animation:badgeGlow 1.8s ease-in-out infinite;
}

.active-badge::after{
    content:'';
    position:absolute;
    left:-45px;
    top:0;
    width:22px;
    height:100%;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.45),
            transparent
        );
    animation:toggleShine 2s linear infinite;
    pointer-events:none;
}

.active-dot{
    width:5px;
    height:5px;
    background:#00ff66;
    border-radius:50%;
    box-shadow:0 0 6px #00ff66;
    animation:
        dotGlow 1.2s ease-in-out infinite alternate,
        dotSpring 1.5s ease-in-out infinite;
}

/* =========================================================
   STATUS BAR
========================================================= */

.status-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(15,0,0,.7);
    border:1px solid rgba(255,255,255,.15);
    border-radius:6px;
    padding:4px 8px;
    font-size:9px;
    color:#ffb3b3;
    font-family:'Share Tech Mono',monospace;
    font-weight:bold;
    z-index:5;
    position:relative;
    animation:metaPulse 2.2s ease-in-out infinite;
}

.status-left{
    display:flex;
    align-items:center;
    gap:4px;
}

.check-icon{
    width:12px;
    height:12px;
    fill:#00ff66;
    filter:drop-shadow(0 0 2px #00ff66);
    animation:checkPulse 1.5s ease-in-out infinite;
}

.status-item{
    animation:statusBlink 1.7s ease-in-out infinite;
}

.status-item span.green-txt{
    color:#00ff66;
    text-shadow:0 0 4px #00ff66;
}

/* =========================================================
   DISPLAY SCREEN
========================================================= */

.display-screen{
    background:rgba(18,0,0,.9);
    border:1px solid rgba(255,100,100,.35);
    border-radius:12px;
    padding:10px 8px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
    z-index:3;
    min-height:120px;
    transform-style:preserve-3d;
    animation:displayBreathing 2.8s ease-in-out infinite;
}

.display-screen::before{
    content:'';
    position:absolute;
    top:-50%;
    left:-50%;
    width:200%;
    height:200%;
    background:
        radial-gradient(
            circle,
            rgba(255,40,40,.25) 0%,
            transparent 65%
        );
    animation:pulseGlow 2.2s ease-in-out infinite alternate;
    pointer-events:none;
    z-index:1;
}

.display-screen::after{
    content:'';
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            180deg,
            transparent 0px,
            transparent 5px,
            rgba(255,255,255,.035) 6px,
            transparent 7px
        );
    background-size:100% 100px;
    animation:scanMove 4.5s linear infinite;
    pointer-events:none;
    z-index:2;
    opacity:.7;
}

/* =========================================================
   INITIAL LOCK VIEW
========================================================= */

.initial-lock-view{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:8;
    position:relative;
    gap:5px;
    padding:4px 0;
}

.svg-lock-icon{
    width:32px;
    height:32px;
    fill:none;
    stroke:#ff4d4d;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter:drop-shadow(0 0 6px rgba(255,77,77,0.8));
    animation:lockGlow 2s ease-in-out infinite;
}

@keyframes lockGlow{
    0%,100%{ transform:scale(1); filter:drop-shadow(0 0 4px rgba(255,77,77,0.6)); }
    50%{ transform:scale(1.08); filter:drop-shadow(0 0 10px rgba(255,0,0,0.9)); }
}

.init-title{
    font-family:'Orbitron',sans-serif;
    font-size:10px;
    font-weight:900;
    color:#ffffff;
    letter-spacing:1px;
    text-shadow:0 0 8px #ff1738;
}

.init-sub{
    font-family:'Share Tech Mono',monospace;
    font-size:8px;
    color:#ff9999;
    letter-spacing:0.5px;
}

/* =========================================================
   SWORD & GLASS SHATTER ANIMATION
========================================================= */

.sword-container{
    position:absolute;
    inset:0;
    z-index:25;
    pointer-events:none;
    overflow:hidden;
    display:none;
}

.sword-container.active{
    display:block;
}

.svg-sword{
    position:absolute;
    left:50%;
    bottom:-60px;
    width:28px;
    height:70px;
    transform:translateX(-50%);
    filter:drop-shadow(0 0 8px #ffffff) drop-shadow(0 0 12px #ff0055);
    animation:swordSlash 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}

@keyframes swordSlash{
    0%{ bottom:-60px; opacity:0; transform:translateX(-50%) scale(0.8); }
    20%{ opacity:1; }
    50%{ bottom:25%; transform:translateX(-50%) scale(1.1); }
    75%{ bottom:80%; opacity:1; }
    100%{ bottom:120%; opacity:0; transform:translateX(-50%) scale(1.3); }
}

.glass-shatter-layer{
    position:absolute;
    inset:0;
    z-index:26;
    pointer-events:none;
    opacity:0;
}

.glass-shatter-layer.shatter-active{
    animation:shatterFlash 0.6s ease-out forwards;
    animation-delay:1.2s;
}

@keyframes shatterFlash{
    0%{ opacity:0; transform:scale(0.9); }
    20%{ opacity:1; background:rgba(255,255,255,0.4); }
    100%{ opacity:0; transform:scale(1.2); }
}

.glass-shard{
    position:absolute;
    background:rgba(255,255,255,0.8);
    box-shadow:0 0 6px #ffffff, 0 0 10px #ff4d4d;
    clip-path:polygon(50% 0%, 0% 100%, 100% 100%);
    opacity:0;
}

.shatter-active .glass-shard{
    animation:shardFly 0.8s ease-out forwards;
    animation-delay:1.2s;
}

.shard-1{ width:14px; height:20px; top:30%; left:40%; }
.shard-2{ width:16px; height:24px; top:25%; left:55%; }
.shard-3{ width:12px; height:18px; top:45%; left:35%; }
.shard-4{ width:15px; height:20px; top:40%; left:60%; }

@keyframes shardFly{
    0%{ opacity:1; transform:translate(0,0) rotate(0deg); }
    100%{ opacity:0; transform:translate(var(--tx), var(--ty)) rotate(var(--rot)); }
}

.shard-1{ --tx:-45px; --ty:-35px; --rot:-120deg; }
.shard-2{ --tx:50px; --ty:-40px; --rot:140deg; }
.shard-3{ --tx:-35px; --ty:40px; --rot:-90deg; }
.shard-4{ --tx:45px; --ty:35px; --rot:180deg; }

/* =========================================================
   ANIMATION STORE ORBIT RINGS
========================================================= */

.store-rings{
    position:absolute;
    left:50%;
    top:50%;
    width:80px;
    height:80px;
    transform:translate(-50%,-50%);
    z-index:2;
    pointer-events:none;
    opacity:.5;
}

.store-ring{
    position:absolute;
    left:50%;
    top:50%;
    border-radius:50%;
    transform:translate(-50%,-50%);
    border:1px solid rgba(255,50,70,.45);
}

.store-ring.r1{ width:45px; height:45px; border-top-color:#ff1738; animation:spin 2.2s linear infinite; }
.store-ring.r2{ width:65px; height:65px; border-right-color:#ffffff; animation:spinReverse 3.4s linear infinite; }
.store-ring.r3{ width:80px; height:80px; border-bottom-color:#ff4d4d; animation:spin 5.5s linear infinite; }
.store-ring.r4{ width:95px; height:95px; border-left-color:rgba(255,255,255,.3); animation:spinReverse 7s linear infinite; }

/* =========================================================
   ORBIT PARTICLES
========================================================= */

.orbit-particle{
    position:absolute;
    left:50%;
    top:50%;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#ffffff;
    box-shadow:0 0 5px #ffffff, 0 0 10px #ff1738;
    z-index:3;
    pointer-events:none;
}

.orbit-particle.p1{ animation:orbitOne 2.4s linear infinite; }
.orbit-particle.p2{ animation:orbitTwo 3.2s linear infinite; }
.orbit-particle.p3{ animation:orbitThree 4.2s linear infinite; }

/* =========================================================
   ENERGY TRAIL
========================================================= */

.energy-trail{
    position:absolute;
    left:50%;
    top:50%;
    width:90px;
    height:3px;
    transform:translate(-50%,-50%);
    background:
        linear-gradient(
            90deg,
            transparent,
            #ff1738,
            #ffffff,
            #ff1738,
            transparent
        );
    filter:blur(1px) drop-shadow(0 0 5px #ff1738);
    opacity:.45;
    z-index:2;
    animation:trailMove 1.8s ease-in-out infinite;
}

/* =========================================================
   SCANNING VIEW
========================================================= */

.scanning-view{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6px 0;
    z-index:8;
    position:relative;
    animation:viewIn .45s cubic-bezier(.2,.8,.2,1);
}

.scan-core{
    position:relative;
    width:35px;
    height:35px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(
            circle,
            #ff7b8b 0%,
            #ff1738 22%,
            #68000d 48%,
            #150001 70%
        );
    box-shadow:0 0 10px #ff1738, 0 0 25px rgba(255,0,40,.6);
    animation:corePulse 1.3s ease-in-out infinite;
}

.scan-core::before{
    content:'';
    position:absolute;
    inset:-5px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.45);
    border-left-color:transparent;
    animation:spin 1.3s linear infinite;
}

.scan-core::after{
    content:'';
    position:absolute;
    inset:-9px;
    border-radius:50%;
    border:1px dashed rgba(255,40,60,.4);
    animation:spinReverse 2.2s linear infinite;
}

.core-text{
    font-family:'Orbitron',sans-serif;
    font-size:8px;
    font-weight:900;
    color:#ffffff;
    text-shadow:0 0 6px #ff1738;
    animation:coreTextPulse 1s ease-in-out infinite;
}

/* Equalizer */
.equalizer-bars{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:22px;
    margin-bottom:4px;
    position:relative;
    z-index:10;
}

.eq-bar{
    width:3.5px;
    background:#ff4d4d;
    border-radius:2px;
    animation:eqBounce .75s ease-in-out infinite alternate;
}

.eq-bar:nth-child(1){ height:12px; animation-delay:.1s; }
.eq-bar:nth-child(2){ height:22px; animation-delay:.3s; }
.eq-bar:nth-child(3){ height:15px; animation-delay:.2s; }
.eq-bar:nth-child(4){ height:24px; animation-delay:.5s; }
.eq-bar:nth-child(5){ height:14px; animation-delay:.2s; }
.eq-bar:nth-child(6){ height:22px; animation-delay:.4s; }

/* Progress */
.scan-percent-text{
    font-family:'Orbitron',sans-serif;
    font-size:14px;
    font-weight:900;
    color:#ffffff;
    margin-bottom:3px;
    text-shadow:0 0 8px #ff4d4d;
    animation:numberMorph .6s ease;
}

.scan-progress-bar{
    width:100%;
    height:4px;
    background:rgba(10,0,0,.9);
    border-radius:4px;
    overflow:hidden;
    border:.5px solid rgba(255,255,255,.3);
    margin-bottom:4px;
    position:relative;
}

.scan-progress-fill{
    width:0%;
    height:100%;
    background:
        linear-gradient(
            90deg,
            #cc0000,
            #ff4d4d,
            #ff9999,
            #ffffff,
            #ff4d4d
        );
    background-size:200% 100%;
    transition:width .08s linear;
    animation:progressShine 1s linear infinite;
    box-shadow:0 0 8px #ff4d4d;
}

.scan-status-text{
    font-family:'Share Tech Mono',monospace;
    font-size:8px;
    color:#ff9999;
    letter-spacing:.4px;
    animation:statusBlink 1.2s ease-in-out infinite;
}

/* =========================================================
   FLOW TRANSITION
========================================================= */

.card-flow-overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:
        linear-gradient(
            135deg,
            #cc0000,
            #400000,
            #ffffff,
            #400000
        );
    background-size:250% 250%;
    z-index:15;
    transform:translateY(-100%);
    border-radius:12px;
    pointer-events:none;
    opacity:.9;
}

.card-flow-overlay.active{
    animation:cardFlowSweep .55s ease-in-out forwards;
}

/* =========================================================
   RESULT VIEW
========================================================= */

.result-view{
    display:flex;
    flex-direction:column;
    z-index:8;
    position:relative;
    animation:viewIn .5s cubic-bezier(.2,1.2,.3,1);
}

.result-view::before{
    content:'';
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            105deg,
            transparent 38%,
            rgba(255,255,255,.55) 50%,
            transparent 62%
        );
    transform:translateX(-120%);
    pointer-events:none;
    animation:powerFlash 1.3s ease-out;
}

.period-header-box{
    background:rgba(35,0,0,.75);
    border-radius:6px;
    padding:4px;
    text-align:center;
    font-family:'Orbitron',sans-serif;
    color:#ffffff;
    font-size:9px;
    font-weight:700;
    letter-spacing:.8px;
    margin-bottom:6px;

    cursor:pointer;

========================================================= */

.three-balls-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    margin:2px 0 8px 0;
    position:relative;
    perspective:400px;

.arrow-indicator{
    color:#00ff66;
    font-size:10px;
    font-weight:900;

.mini-ball-wrap{
    width:36px;
    height:36px;

    justify-content:center;
    align-items:center;
    position:relative;
    box-shadow:
        0 3px 8px rgba(0,0,0,.8),
        inset -2px -2px 5px rgba(0,0,0,.6),
        inset 2px 2px 5px rgba(255,255,255,.5);
    border:1px solid rgba(255,255,255,.7);
    background:
        radial-gradient(
            circle at 35% 35%,
            #ff6666 0%,
            #800000 100%
        );
    animation:ballPulse 2s ease-in-out infinite;
}

.mini-ball-wrap img{
    width:28px;
    height:28px;
    object-fit:contain;
    animation:ballImageFloat 1.8s ease-in-out infinite;
}

.mini-ball-wrap.middle-ball{
    width:46px;
    height:46px;

        inset 2px 2px 5px rgba(255,255,255,.7);

        radial-gradient(

            #ff8080 0%,
            #b30000 100%

.mini-ball-wrap.middle-ball img{

    height:36px;
}

.ball-next{

========================================================= */

.prediction-tags-row{

}

.tag-badge{
    display:flex;

    color:#ffffff;

    border-radius:10px;
    border:.5px solid rgba(255,255,255,.15);

    overflow:hidden;
}

.tag-badge::after{
    content:'';
    position:absolute;
    left:-50px;
    top:0;

    height:100%;

            90deg,
            transparent,
            rgba(255,255,255,.3),

    pointer-events:none;

.tag-dot{
    width:5px;
    height:5px;
    border-radius:50%;

========================================================= */

    display:flex;
    gap:8px;
    z-index:100;
    position:relative;
    margin-top:2px;
}

.btn{

    font-weight:900;

.btn::before{
    content:'';
    position:absolute;

    left:-70px;
    width:35px;
    height:140%;

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.4),

.btn-result{

/* API PERIOD NUMBER RETRIEVAL */
async function fetchLatestPeriod() {
    if (forcedPeriodString !== null) {
        return forcedPeriodString;
    }
    try {
        const response = await fetch("https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json");
        const data = await response.json();
        if (data && data.data && data.data.list && data.data.list.length > 0) {
            const fullIssue = data.data.list[0].issueNumber || data.data.list[0].issue;
            if (fullIssue) {
                return String(fullIssue).slice(-5);
            }
        }
    } catch (err) {
        console.log("API Fetch error:", err);
    }
    const BASE_TIME = new Date("2026-10-04T23:00:00+05:30").getTime();
    const BASE_PERIOD = 20261003100011131n;
    const elapsedMinutes = Math.floor((Date.now() - BASE_TIME) / 60000);
    const currentPeriod = BASE_PERIOD + BigInt(Math.max(0, elapsedMinutes));
    return currentPeriod.toString().slice(-5);
}

/* RESULT BUTTON CLICK */
let isScanning = false;

btnExecute.addEventListener("click", async function(e){
    e.preventDefault(); e.stopPropagation();

    if(isScanning) return;
    isScanning = true;

    initialLockView.classList.add("hidden");
    resultView.classList.add("hidden");
    scanningView.classList.remove("hidden");

    scanPercentText.innerText = "0%";
    scanProgressFill.style.width = "0%";

    swordContainer.classList.add("active");
    glassShatterLayer.classList.add("shatter-active");

    const startTime = performance.now();
    const duration = 2500;

    await new Promise(resolve => {
        const interval = setInterval(() => {
            const elapsed = performance.now() - startTime;
            let progress = Math.min(100, Math.floor((elapsed / duration) * 100));

            scanPercentText.innerText = `${progress}%`;
            scanProgressFill.style.width = `${progress}%`;

            if(progress >= 100){
                clearInterval(interval);
                cardFlow.classList.remove("active");
                void cardFlow.offsetWidth;
                cardFlow.classList.add("active");
                setTimeout(resolve, 300);
            }
        }, 30);
    });

    swordContainer.classList.remove("active");
    glassShatterLayer.classList.remove("shatter-active");

    await showResult();

    isScanning = false;
});

/* DRAG SYSTEM */
function makeMovable(element, handle){
    let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
    let isDragging = false;
    const dragHandle = handle || element;

    dragHandle.addEventListener("mousedown", dragStart);
    dragHandle.addEventListener("touchstart", dragStart, {passive:false});

    function dragStart(e){
        if(e.target.closest("button")) return;
        isDragging = false;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        pos3 = clientX; pos4 = clientY;

        document.addEventListener("mousemove", dragMove);
        document.addEventListener("touchmove", dragMove, {passive:false});
        document.addEventListener("mouseup", dragEnd);
        document.addEventListener("touchend", dragEnd);
    }

    function dragMove(e){
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        if(Math.abs(clientX - pos3) > 4 || Math.abs(clientY - pos4) > 4){
            isDragging = true;
        }

        if(!isDragging) return;
        if(e.cancelable) e.preventDefault();

        pos1 = pos3 - clientX;
        pos2 = pos4 - clientY;
        pos3 = clientX;
        pos4 = clientY;

        let newTop = element.offsetTop - pos2;
        let newLeft = element.offsetLeft - pos1;

        const elemWidth = element.offsetWidth;
        const elemHeight = element.offsetHeight;

        const minTop = elemHeight / 2 + 5;
        const maxTop = window.innerHeight - elemHeight / 2 - 5;
        const minLeft = elemWidth / 2 + 5;
        const maxLeft = window.innerWidth - elemWidth / 2 - 5;

        newTop = Math.max(minTop, Math.min(newTop, maxTop));
        newLeft = Math.max(minLeft, Math.min(newLeft, maxLeft));

        element.style.top = newTop + "px";
        element.style.left = newLeft + "px";
        element.style.transform = "translate(-50%,-50%)";
    }

    function dragEnd(){
        document.removeEventListener("mousemove", dragMove);
        document.removeEventListener("touchmove", dragMove);
        document.removeEventListener("mouseup", dragEnd);
        document.removeEventListener("touchend", dragEnd);
    }
}
